name: api_compartilhado
description: Configurações partilhadas entre Web e Android para o sistema Gestor 365.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gerenciamento de Estado
  provider: ^6.1.2
  
  # Utilidades e Dados
  uuid: ^4.4.0
  decimal: ^2.3.3
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.3
  connectivity_plus: ^6.0.3
  
  # Documentos e Arquivos
  pdf: ^3.11.0
  printing: ^5.11.0
  open_filex: ^4.4.0
  file_picker: ^13.1.0
  path_provider: ^2.1.3
  path: ^1.9.0
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# SEÇÃO CORRETA PARA ASSETS E CONFIGURAÇÕES DO FLUTTER
flutter:
  uses-material-design: true # Opcional, mas recomendado se usar componentes Material
